[workspace]
resolver = "2"
members = [
    "crates/ironhold_core",
    "crates/ironhold_native",
    "crates/ironhold_web",
    "crates/ironhold_cli",
]

[workspace.dependencies]
bevy = { version = "0.18.0", features = ["serialize", "wav", "vorbis", "mp3", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.11"
bevy_common_assets = { git = "https://github.com/NiklasEi/bevy_common_assets", rev = "ae3243defb5c07170c1ece647061f4117cf5f97e" }
bevy_framepace = "0.21"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"     # optimise for binary size; important for WASM GitHub Pages limit
lto = "thin"        # Link-Time Optimization across crates
codegen-units = 1   # Restricts code generation blocks for better compression, but can hurt performance; this is a tradeoff for smaller binary size
debug = false       # Strip debug info for smaller binary size
# overflow-checks = false # Disable overflow checks for maximum performance


[profile.test]
# line-tables-only (not full `true`/2): each of the ~19 separate ironhold_core test binaries
# links its own full copy of Bevy + deps; full debuginfo generates a large separate PDB per binary
# (split-debuginfo = "packed" on MSVC) and was implicated in repeated "Unexpected PDB error"
# LNK1318 linker failures under low disk (2026-07-12). line-tables-only still gives panic
# messages a file:line, just not full type/variable debug info -- plenty for test failures.
debug = "line-tables-only"
opt-level = 3
debug-assertions = true
overflow-checks = true
split-debuginfo = "packed" # Extracts symbols into a separate .dwp file

[profile.test.package."*"]
# Test-only: dependency code (Bevy, Rapier, etc.) doesn't need release-grade FPS in headless unit
# tests, so this trades a bit of runtime speed for much faster compiles — every one of the ~19
# separate ironhold_core test binaries otherwise fully re-optimizes the entire dependency tree at
# opt-level 3. Deliberately NOT applied to [profile.dev.package."*"] below, which stays at 3.
opt-level = 1

[profile.dev]
opt-level = 3       # Match release performance for local code
debug = true        # Retain full debugging info (symbols, line tables)
debug-assertions = true
overflow-checks = true # Keep panic safety features active for dev
split-debuginfo = "packed" # Extracts symbols into a separate .dwp file

[profile.dev.package."*"]
opt-level = 3       # Match release performance for Bevy engine code