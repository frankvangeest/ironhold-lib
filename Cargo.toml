[workspace]
resolver = "2"
members = [
    "crates/ironhold_core",
    "crates/ironhold_native",
    "crates/ironhold_web",
]

[workspace.dependencies]
bevy = { version = "0.18.0", features = ["serialize", "wav", "vorbis", "mp3"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.11"
bevy_common_assets = { git = "https://github.com/NiklasEi/bevy_common_assets", branch = "main" }
wasm-bindgen = "0.2"

[profile.test]
debug = true
opt-level = 0
debug-assertions = true
overflow-checks = true
