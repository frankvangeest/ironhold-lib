[package]
name = "ironhold_web"
version = "0.1.0"
edition = "2021"
description = "The runtime web build of Ironhold"
repository = "https://github.com/frankvangeest/ironhold-lib"
license = "MIT OR Apache-2.0"
authors = ["Frank van Geest"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ironhold_core = { path = "../ironhold_core" }
bevy = { workspace = true }
wasm-bindgen = { workspace = true }

# For the DebugState in the DOM and browser tests
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location", "UrlSearchParams"] }

# `wasm-opt` was previously disabled here (`wasm-opt = false`) -- re-enabling it with `-Oz`
# (2026-08-31) cut the release ironhold_web_bg.wasm from 93.2 MiB to 30.6 MiB, a 67% reduction,
# with no observed behavior change across a full manual playtest. Binaryen's `-Oz` is the size-
# focused optimization level, matching the root Cargo.toml's `opt-level = "s"` intent. Do NOT
# disable this again without re-measuring -- it is the single largest lever on this binary's size
# relative to the GitHub Pages 100 MiB hard limit (95 MiB warn threshold).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[features]
inspector = ["ironhold_core/inspector"]
webgpu = ["bevy/webgpu"]
