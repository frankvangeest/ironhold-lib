# Throwaway Nakama for the contract test (tests/contract.rs). The server key is Nakama's default and this stack is never exposed:
# it binds to 127.0.0.1 only. The version is pinned; bump it deliberately and re-run the contract test.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 2s
      timeout: 3s
      retries: 30

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.41.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama1 --database.address postgres:localdb@postgres:5432/nakama
        --logger.level INFO --session.token_expiry_sec 7200 --runtime.path /nakama/data/modules
    volumes:
      - ./modules:/nakama/data/modules
    ports:
      - "127.0.0.1:7350:7350"
