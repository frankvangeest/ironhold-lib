<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ironhold — Play</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bar-bg: rgba(10, 10, 15, 0.72);
            --bar-border: rgba(255, 255, 255, 0.06);
            --text-primary: #f0f0f5;
            --text-secondary: #8888a0;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            height: 100%;
        }

        /* The page is exactly one viewport tall: the top bar (44px, or none with ?bar=hidden /
           ?testing=1) plus the game host below it, which takes the rest. `100dvh` tracks the
           mobile browser's collapsing URL bar; `height: 100%` (on html) is the fallback. */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* The engine draws into #ironhold-canvas (Window.canvas, `start_app`). Bevy's
           fit_canvas_to_parent sets the canvas CSS to width/height 100% of its parent, so this host
           must have a definite size: `flex: 1` + `min-height: 0` gives it the viewport minus the
           top bar, and the canvas then follows every browser resize. */
        .game-host {
            position: relative;
            flex: 1 1 0;
            min-height: 0;
            min-width: 0;
        }

        /* Render-budget scaler (see "Render budget" in the script below). It is the canvas's parent, so
           Bevy's fit_canvas_to_parent fills IT. With --k > 1 it is made 1/k of the host's size and scaled up
           by k, so the backing store (CSS size x devicePixelRatio, measured before the transform) is capped
           while the picture still fills the host. --k is 1 for any viewport at or under the pixel budget, and
           then the script sets `transform: none` (the box is full size). Pointer positions are element-local (winit uses
           offsetX/offsetY), so they stay correct under the transform. NOTE: the transform makes this a
           containing block for any future position:fixed child and may affect canvas.requestFullscreen(). */
        .canvas-scaler {
            --k: 1;
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% / var(--k));
            height: calc(100% / var(--k));
            transform: scale(var(--k));
            transform-origin: 0 0;
        }

        canvas {
            display: block;
        }

        /* ── Top bar ──
           Static and in normal page flow: it sits ABOVE the game canvas instead of floating over
           it, so it never covers or intercepts clicks on the game's own top-of-screen UI. The
           game canvas sits in .game-host below this bar and fills the rest of the viewport. Add ?bar=hidden to
           the URL to remove the bar entirely (?testing=1, used by test_web.py, also hides it). */
        .top-bar {
            position: relative;
            z-index: 1000;
            flex: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0 1.25rem;
            height: 44px;
            background: var(--bar-bg);
            border-bottom: 1px solid var(--bar-border);
        }

        /* Fully hidden in test mode */
        .top-bar.testing-mode,
        .top-bar.bar-hidden,
        .loading-overlay.testing-mode {
            display: none !important;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.3rem 0.7rem 0.3rem 0.5rem;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: color var(--transition), background var(--transition), border-color var(--transition);
        }

        .back-link:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .back-link svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .bar-separator {
            width: 1px;
            height: 18px;
            background: var(--bar-border);
            flex-shrink: 0;
        }

        .project-name {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        /* Docs link sits at the far right of the static bar; opens in a new tab so the running game is not torn down. */
        .docs-link {
            margin-left: auto;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .project-name .accent-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            margin-right: 0.45rem;
            box-shadow: 0 0 8px var(--accent-glow);
            vertical-align: middle;
        }

        /* ── Loading overlay ── */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: grid;
            place-items: center;
            background: var(--bg-primary);
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-content {
            text-align: center;
        }

        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(139, 92, 246, 0.15);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }
    </style>
</head>

<body>

    <!-- Static top bar above the Canvas (not an overlay). ?bar=hidden or ?testing=1 removes it. -->
    <nav class="top-bar" id="top-bar">
        <a href="index.html" class="back-link" id="back-link">
            <svg viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6" />
            </svg>
            Gallery
        </a>
        <div class="bar-separator"></div>
        <span class="project-name" id="project-name">
            <span class="accent-dot"></span>
            <span id="project-label">Loading…</span>
        </span>
        <a href="https://github.com/frankvangeest/ironhold-lib/blob/main/docs/README.md" class="back-link docs-link" id="docs-link" target="_blank" rel="noopener">Docs</a>
    </nav>

    <!-- Game host: sized to the viewport below the bar; the engine draws into the canvas inside it
         (Window.canvas = "#ironhold-canvas"). Needs a pkg/ built from the same commit: a stale
         pkg does not know this selector and appends its own fixed-size canvas to <body> instead. -->
    <div class="game-host" id="game-host">
        <div class="canvas-scaler" id="ironhold-scaler">
            <canvas id="ironhold-canvas"></canvas>
        </div>
    </div>

    <!-- Loading indicator shown until the engine's first frame has run -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">Initializing engine…</div>
        </div>
    </div>

    <!-- Populated each frame by the WASM runtime for browser testing -->
    <div id="debug-state" style="display:none"></div>

    <script>
        // ─── Bevy log-level bridge ────────────────────────────────────────────
        // Bevy's wasm log layer (tracing-wasm 0.2.1) declares ONLY console.log
        // bindings — log1/log2/log3/log4, all `js_name = log`. There is no
        // console.error or console.warn binding anywhere in that crate, so every
        // level (TRACE..ERROR) reaches DevTools as a console.log, differing only
        // by a `%c` CSS colour string. Consequences: the DevTools error badge
        // stays at 0, and filtering the console by "Errors" or "Warnings" — the
        // first thing you do when hunting a failure — hides Bevy's own error!/
        // warn! output completely.
        //
        // Root-caused 2026-09-04: a RON parse failure in logic/rules.ron logged a
        // correct `error!` from project_loader.rs plus bevy_asset's own
        // "Failed to load asset" error, and both were reported as invisible
        // because they were buried among ~40 INFO lines and excluded by the
        // console's error filter.
        //
        // Re-dispatch those lines to the matching console method so severity
        // filters, the error badge, and stack grouping all work again. Must run
        // before ./pkg/ironhold_web.js is imported (module scripts are deferred,
        // so this classic script always wins the race).
        (function () {
            const rawLog = console.log.bind(console);
            console.log = function (...args) {
                const first = args[0];
                if (typeof first === 'string') {
                    if (first.startsWith('%cERROR')) { console.error(...args); return; }
                    if (first.startsWith('%cWARN')) { console.warn(...args); return; }
                }
                rawLog(...args);
            };
        })();
    </script>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);

            // In testing mode, hide all UI overlays so they don't interfere with canvas clicks
            if (params.get('testing') === '1') {
                document.getElementById('top-bar').classList.add('testing-mode');
                document.getElementById('loading-overlay').classList.add('testing-mode');
            }

            // ?bar=hidden: no navigation bar (e.g. to play with the game filling the window)
            if (params.get('bar') === 'hidden') {
                document.getElementById('top-bar').classList.add('bar-hidden');
            }

            // ─── Render budget ────────────────────────────────────────────────
            // The engine's canvas backing store is CSS size x devicePixelRatio (wgpu writes
            // canvas.width/height from the size winit's ResizeObserver reports), so a 4K monitor at DPR 1.5 would
            // render ~8 MP. Cap it at BUDGET_PX (2560x1440 = 3,686,400) by CSS-scaling the canvas's parent
            // (.canvas-scaler): k = sqrt(cssW*cssH*dpr^2 / budget), rounded UP to 0.05 so the budget holds, then
            // limited so the engine's logical window stays at least 1280x720 (the HUDs are authored for that; a
            // small HiDPI laptop may therefore go slightly over budget). k is 1 (no scaling) at or under budget.
            // Must run before the module script starts the engine, or the first surface configure allocates full
            // size render targets (~350 MB at 8 MP) and immediately reallocates them.
            // ?px_budget=<megapixels> overrides the budget (e.g. 2.1 to experiment); ?px_budget=off disables the cap.
            // Only this page applies it: another page embedding the engine renders uncapped unless it copies this.
            const BUDGET_PX = 3686400;
            const MIN_LOGICAL_W = 1280, MIN_LOGICAL_H = 720;
            const K_STEP = 0.05;
            let budget = BUDGET_PX;
            const pxBudget = params.get('px_budget');
            if (pxBudget === 'off') {
                budget = Infinity;
            } else if (pxBudget && Number(pxBudget) > 0) {
                budget = Math.round(Number(pxBudget) * 1e6);
            } else if (pxBudget !== null) {
                console.warn(`Ignoring ?px_budget=${pxBudget} (expected a positive number of megapixels, or "off"); using the default.`);
            }
            const gameHost = document.getElementById('game-host');
            const scaler = document.getElementById('ironhold-scaler');
            function applyRenderBudget() {
                // Measure the host, never the scaler: the scaler's size depends on k (no feedback loop).
                const w = gameHost.clientWidth, h = gameHost.clientHeight;
                let k = 1;
                if (w > 0 && h > 0 && Number.isFinite(budget)) {
                    const dpr = window.devicePixelRatio || 1;
                    const kBudget = Math.ceil(Math.sqrt((w * h * dpr * dpr) / budget) / K_STEP - 1e-9) * K_STEP;
                    const kFloor = Math.min(w / MIN_LOGICAL_W, h / MIN_LOGICAL_H);
                    k = Math.max(1, Math.min(kBudget, kFloor));
                    if (k < 1 + 1e-6) k = 1;
                }
                k = Math.round(k * 10000) / 10000;   // keep the DOM / ironholdRenderScale free of float noise
                scaler.style.setProperty('--k', String(k));
                // No transform at all when uncapped: a transform (even scale(1)) makes the scaler a stacking
                // context and a containing block for position:fixed descendants.
                scaler.style.transform = k === 1 ? 'none' : '';
                window.ironholdRenderScale = k;
            }
            applyRenderBudget();
            new ResizeObserver(applyRenderBudget).observe(gameHost);
            // devicePixelRatio changes (browser zoom, moving between monitors) do not resize the host; the media
            // query is bound to one DPR value, so re-arm it after each change.
            (function watchDpr() {
                const mq = window.matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
                mq.addEventListener('change', () => { applyRenderBudget(); watchDpr(); }, { once: true });
            })();

            // Show project name from URL
            const project = params.get('project');
            const label = document.getElementById('project-label');
            if (project) {
                // "3rd_person_game_demo" → "3rd Person Game Demo"
                label.textContent = project.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                document.title = `Ironhold — ${label.textContent}`;
            } else {
                label.textContent = 'Default Project';
            }

            // Readiness signal: the engine is "ready" once its first frame has run, which is the
            // first time the WASM runtime writes the debug-state JSON (sync_debug_state_to_dom,
            // every PostUpdate). A <canvas> existing is NOT that signal: the canvas can be present
            // before the wasm has loaded (and a canvas authored in the HTML would always be).
            // Sets `data-ready` on <body>; test_web.py waits on `body[data-ready]` too.
            const debugState = document.getElementById('debug-state');
            const markReady = () => {
                if (!debugState.textContent.trim()) return false;
                document.body.setAttribute('data-ready', '');
                document.getElementById('loading-overlay').classList.add('hidden');
                return true;
            };
            if (!markReady()) {
                const observer = new MutationObserver(() => {
                    if (markReady()) observer.disconnect();
                });
                observer.observe(debugState, { childList: true, characterData: true, subtree: true });
            }

            // The overlay now waits for the engine's first frame, so if the engine can never start
            // (no WebGPU adapter, a failed import/init) it must say so instead of spinning forever.
            // The module script calls this on a thrown init/import error; a timeout covers the silent
            // case (some browsers never resolve the adapter request).
            const overlay = document.getElementById('loading-overlay');
            const text = overlay.querySelector('.loading-text');
            const spinner = overlay.querySelector('.loading-spinner');
            window.ironholdStartupFailed = (reason) => {
                if (document.body.hasAttribute('data-ready')) return;
                if (spinner) spinner.style.display = 'none';
                text.textContent = reason;
            };
            // A Rust panic before the first frame (e.g. bevy_render finding no WebGPU adapter) does not
            // reject init(): it later surfaces as an uncaught `RuntimeError: unreachable`.
            const crashed = (e) => {
                const msg = String(e?.message ?? e?.reason?.message ?? e?.reason ?? e);
                if (msg.includes('control flow')) return;
                if (msg.includes('unreachable') || msg.includes('panicked')) {
                    window.ironholdStartupFailed(
                        'The engine crashed while starting. This build needs a browser with WebGPU (recent Chrome or Edge); see the console for details.'
                    );
                }
            };
            window.addEventListener('error', crashed);
            window.addEventListener('unhandledrejection', crashed);
            setTimeout(() => window.ironholdStartupFailed(
                'The engine has not started. This build needs a browser with WebGPU (recent Chrome or Edge); check the console for errors.'
            ), 60000);
        })();
    </script>

    <script type="module">
        // This assumes wasm-pack build --target web --out-dir pkg
        // import init from './pkg/ironhold_web.js';
        let ironhold;
        try {
            try {
                // Primary source (local)
                ironhold = await import('./pkg/ironhold_web.js');
            } catch (err) {
                console.warn('Primary local import failed, trying GitHub Pages fallback...');
                // Fallback source (GitHub Pages)
                ironhold = await import('https://frankvangeest.github.io/ironhold-lib/pkg/ironhold_web.js');
            }
        } catch (err) {
            console.error('Could not load the engine module:', err);
            window.ironholdStartupFailed?.('Could not load the engine (pkg/ironhold_web.js). Build it with wasm-pack, or check your connection.');
        }

        async function run() {
            if (!ironhold) return;
            // Dynamic import() returns the module namespace object.
            // wasm-pack --target web exports init as the default export only,
            // so use .default — not .init — when loading via import().
            const initFn = ironhold.default ?? ironhold.init;
            try {
                await initFn();
            } catch (err) {
                // winit's web event loop unwinds with a deliberate exception ("Using exceptions for
                // control flow, don't mind me. This isn't actually an error!") that surfaces here on
                // a perfectly healthy start; only a different error is a real failure.
                if (String(err?.message ?? err).includes('control flow')) return;
                console.error('Engine failed to start:', err);
                window.ironholdStartupFailed?.('The engine failed to start (see the browser console). This build needs WebGPU.');
            }
        }

        run();
    </script>
</body>

</html>
