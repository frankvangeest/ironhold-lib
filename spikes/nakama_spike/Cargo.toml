# THROWAWAY spike (planning/features/nakama_backend_spike.md). Not part of the engine workspace, never shipped.
# The empty [workspace] table below makes this a standalone crate so it cannot touch the engine's Cargo.lock,
# feature unification or build times. Delete or promote it when the go/no-go decision is made.
[package]
name = "nakama_spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
base64 = "0.22"
ehttp = "0.7"
ewebsock = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util = "0.3.34"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "time", "net", "io-util"] }
tokio-tungstenite = "0.30.0"
